<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Placement Test</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .start-btn,
        .next-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: 0.2s;
        }

        .start-btn:hover,
        .next-btn:hover {
            transform: translateY(-2px);
            background: #5568d9;
        }

        #test {
            margin-top: 10px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #777;
            font-size: 14px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #667eea;
            border-radius: 10px;
            transition: 0.3s;
        }

        #question {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
            white-space: pre-line;
        }

        #answers {
            margin-bottom: 25px;
        }

        .answer-btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid #e2e2e2;
            border-radius: 10px;
            background: white;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f5f6ff;
        }

        .answer-btn.selected {
            border-color: #667eea;
            background: #eef0ff;
            font-weight: bold;
        }

        /* NEXT + SKIP BUTTONS */

        .test-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .skip-btn {
            width: 100%;
            border: 2px solid #667eea;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #667eea;
            transition: 0.2s;
        }

        .skip-btn:hover {
            background: #eef0ff;
            transform: translateY(-2px);
        }

        /* RESULT */

        #result {
            text-align: center;
        }

        .result-card {
            text-align: center;
            padding: 10px 5px;
        }

        .result-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #eef0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .result-card h2 {
            font-size: 32px;
            color: #222;
            margin-bottom: 8px;
        }

        .result-subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .student-result {
            font-size: 21px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #f7f8ff;
            border: 1px solid #e8eaff;
            border-radius: 15px;
            padding: 18px 10px;
        }

        .stat-label {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .score-number,
        .percentage {
            font-size: 30px;
            font-weight: bold;
            color: #667eea;
            margin: 0;
        }

        .level-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .level-label {
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 5px;
        }

        .level-badge {
            display: block;
            font-size: 26px;
            font-weight: bold;
        }

        .level-message {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin: 0 auto 25px;
            max-width: 500px;
        }

        .restart-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: 0.2s;
        }

        .restart-btn:hover {
            background: #5568d9;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {

            .card {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }

            #question {
                font-size: 20px;
            }

            .result-card h2 {
                font-size: 26px;
            }

            .result-stats {
                gap: 10px;
            }

            .stat-box {
                padding: 15px 8px;
            }

            .test-buttons {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- START -->

        <div id="start">

                </button>

                <button
                    class="next-btn"
                    onclick="nextQuestion()">
                    NEXT →

        </div>


        <!-- RESULT -->

        <div id="result" style="display:none;"></div>

    </div>

</div>

        document.getElementById("studentName").value.trim();

    if (studentName === "") {
        alert("Please enter your name.");
        return;
    }

    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;

    document.getElementById("start").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("test").style.display = "block";

    showQuestion();
}


function showQuestion() {

    selectedAnswer = null;

    const q = questions[currentQuestion];

    document.getElementById("question").textContent =
        (currentQuestion + 1) + ". " + q.question;

    const answersDiv =
        document.getElementById("answers");

    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.textContent =
            String.fromCharCode(65 + index) + ". " + answer;

        button.className = "answer-btn";

        button.onclick = function() {

            selectedAnswer = index;

            const allButtons =
                answersDiv.querySelectorAll(".answer-btn");

            allButtons.forEach(btn => {
                btn.classList.remove("selected");
            });

            button.classList.add("selected");

        };

        answersDiv.appendChild(button);

    });


    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    const percentage =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";
}


function nextQuestion() {

    if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;
    }

    if (
        selectedAnswer ===
        questions[currentQuestion].correct
    ) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        finishTest();

    }
}


function skipQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        finishTest();

    }
}


function finishTest() {

    document.getElementById("test").style.display = "none";
    document.getElementById("result").style.display = "block";

    const percentage =
        Math.round((score / questions.length) * 100);

    let level = "";
    let message = "";

    if (score <= 6) {

        level = "Beginner";

        message =
            "Focus on basic vocabulary and grammar. Keep practicing!";

    } else if (score <= 20) {

        level = "Elementary";

        message =
            "You have a good basic foundation. Keep improving your grammar and vocabulary!";

    } else if (score <= 34) {

        level = "Pre-Intermediate";

        message =
            "You have a solid foundation. Practice speaking and expand your vocabulary!";

    } else if (score <= 48) {

        level = "Intermediate";

        message =
            "Good job! You can communicate well, but there is still room to improve.";

    } else if (score <= 62) {

        level = "Upper-Intermediate";

        message =
            "Very good! You have a strong command of English.";

    } else {

        level = "Advanced";

        message =
            "Excellent! You have an advanced level of English.";

    }


    document.getElementById("result").innerHTML = `

        <div class="result-card">

            <div class="result-icon">
                🎉
            </div>

            <h2>
                Test Completed!
            </h2>

            <p class="result-subtitle">
                Your English placement result
            </p>

            <p class="student-result">
                ${studentName}
            </p>

            <div class="result-stats">

                <div class="stat-box">

                    <span class="stat-label">
                        SCORE
                    </span>

                    <p class="score-number">
                        ${score}/${questions.length}
                    </p>

                </div>


                <div class="stat-box">

                    <span class="stat-label">
                        PERCENTAGE
                    </span>

                    <p class="percentage">
                        ${percentage}%
                    </p>

                </div>

            </div>


            <div class="level-box">

                <div class="level-label">
                    YOUR ENGLISH LEVEL
                </div>

                <div class="level-badge">
                    ${level}
                </div>

            </div>


            <p class="level-message">
                ${message}
            </p>


            <button
                onclick="restartTest()"
                class="restart-btn">
                🔄 Take the Test Again
            </button>

        </div>

    `;
}


function restartTest() {

    currentQuestion = 0;
    score = 0;
    selectedAnswer = null;
    studentName = "";

    document.getElementById("result").style.display = "none";
    document.getElementById("test").style.display = "none";
    document.getElementById("start").style.display = "block";

    document.getElementById("studentName").value = "";

    document.getElementById("progressBar").style.width = "0%";
}

</script>

</body>

</html>
